<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANEL HANEEF STORE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  
  .header {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }
  
  .header h1 {
    color: #333;
    font-size: 28px;
    margin-bottom: 5px;
  }
  
  .header p { color: #666; font-size: 14px; }
  
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }
  
  .stat-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    border-left: 5px solid;
  }
  
  .stat-card.modal { border-color: #f59e0b; }
  .stat-card.penjualan { border-color: #3b82f6; }
  .stat-card.laba { border-color: #10b981; }
  .stat-card.produk { border-color: #8b5cf6; }
  
  .stat-card .label { font-size: 12px; color: #666; text-transform: uppercase; font-weight: 600; }
  .stat-card .value { font-size: 22px; font-weight: bold; color: #222; margin-top: 8px; }
  
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
  }
  
  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
  }
  
  .panel {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  
  .panel h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
  }
  
  .form-group { margin-bottom: 12px; }
  
  .form-group label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
    font-weight: 600;
  }
  
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border 0.2s;
  }
  
  .form-group input:focus {
    outline: none;
    border-color: #667eea;
  }
  
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    margin-top: 10px;
  }
  
  .btn-sell {
    background: #10b981;
    color: white;
    padding: 6px 12px;
    font-size: 12px;
    width: auto;
  }
  
  .btn-delete {
    background: #ef4444;
    color: white;
    padding: 6px 12px;
    font-size: 12px;
    width: auto;
  }
  
  .preview-foto {
    width: 100%;
    height: 150px;
    border: 2px dashed #ccc;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 10px;
    overflow: hidden;
    background: #fafafa;
  }
  
  .preview-foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
  }
  
  .product-card {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    background: #fafafa;
  }
  
  .product-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  
  .product-img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    background: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    font-size: 40px;
  }
  
  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  
  .product-info { padding: 12px; }
  
  .product-name {
    font-weight: bold;
    color: #222;
    font-size: 14px;
    margin-bottom: 6px;
  }
  
  .product-detail {
    font-size: 12px;
    color: #666;
    margin-bottom: 3px;
  }
  
  .product-detail span { font-weight: 600; color: #333; }
  
  .product-actions {
    display: flex;
    gap: 6px;
    padding: 0 12px 12px;
  }
  
  .empty {
    text-align: center;
    color: #999;
    padding: 40px 20px;
    font-size: 14px;
  }
  
  .search-bar {
    margin-bottom: 15px;
  }
  
  .search-bar input {
    width: 100%;
    padding: 10px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
  }
  
  .table-wrap {
    overflow-x: auto;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  
  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }
  
  th {
    background: #f9fafb;
    color: #555;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
  }
  
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .modal-overlay.show {
    display: flex;
  }
  
  .modal {
    background: white;
    border-radius: 15px;
    padding: 25px;
    max-width: 400px;
    width: 100%;
  }
  
  .modal h3 {
    margin-bottom: 15px;
    color: #333;
  }
  
  .modal p {
    margin-bottom: 15px;
    color: #666;
    font-size: 14px;
  }
  
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
  }
  
  .modal-actions .btn {
    margin: 0;
  }
  
  .btn-secondary {
    background: #e5e7eb;
    color: #333;
  }
  
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #10b981;
    color: white;
    padding: 14px 20px;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    z-index: 1000;
    font-size: 14px;
    font-weight: 600;
  }
  
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  
  .tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 15px;
    border-bottom: 2px solid #f0f0f0;
  }
  
  .tab {
    padding: 10px 15px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #999;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  
  .tab.active {
    color: #667eea;
    border-bottom-color: #667eea;
  }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  
  .badge-green { background: #d1fae5; color: #065f46; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>PANEL HANEEF STORE</h1>
    <p>Sistem Manajemen Produk & Analisis Laba</p>
  </div>
  
  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card modal">
      <div class="label">Total Modal</div>
      <div class="value" id="statModal">Rp 0</div>
    </div>
    <div class="stat-card penjualan">
      <div class="label">Total Penjualan</div>
      <div class="value" id="statPenjualan">Rp 0</div>
    </div>
    <div class="stat-card laba">
      <div class="label">Total Laba</div>
      <div class="value" id="statLaba">Rp 0</div>
    </div>
    <div class="stat-card produk">
      <div class="label">Total Produk</div>
      <div class="value" id="statProduk">0</div>
    </div>
  </div>
  
  <div class="main-grid">
    <!-- Form Input -->
    <div class="panel">
      <h2>➕ Tambah Produk</h2>
      <div class="preview-foto" id="previewFoto">📷 Upload Foto</div>
      <div class="form-group">
        <label>Foto Produk</label>
        <input type="file" id="inputFoto" accept="image/*">
      </div>
      <div class="form-group">
        <label>Nama Produk</label>
        <input type="text" id="inputNama" placeholder="Contoh: Indomie Goreng">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Harga Modal (Rp)</label>
          <input type="number" id="inputModal" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label>Harga Jual (Rp)</label>
          <input type="number" id="inputJual" placeholder="0" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Stok Awal</label>
        <input type="number" id="inputStok" placeholder="0" min="0">
      </div>
      <button class="btn btn-primary" onclick="tambahProduk()">Simpan Produk</button>
    </div>
    
    <!-- Katalog & Analisis -->
    <div class="panel">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('katalog')">📦 Katalog</button>
        <button class="tab" onclick="switchTab('riwayat')">📊 Riwayat Penjualan</button>
      </div>
      
      <div class="tab-content active" id="tab-katalog">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="🔍 Cari produk..." oninput="renderKatalog()">
        </div>
        <div class="product-grid" id="productGrid">
          <div class="empty">Belum ada produk. Tambahkan produk pertama Anda!</div>
        </div>
      </div>
      
      <div class="tab-content" id="tab-riwayat">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Produk</th>
                <th>Qty</th>
                <th>Modal</th>
                <th>Penjualan</th>
                <th>Laba</th>
              </tr>
            </thead>
            <tbody id="riwayatBody">
              <tr><td colspan="6" class="empty">Belum ada riwayat penjualan</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Jual -->
<div class="modal-overlay" id="modalJual">
  <div class="modal">
    <h3>🛒 Jual Produk</h3>
    <p id="jualNamaProduk"></p>
    <div class="form-group">
      <label>Jumlah Terjual</label>
      <input type="number" id="jualQty" min="1" value="1">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeJual()">Batal</button>
      <button class="btn btn-primary" style="margin:0" onclick="konfirmasiJual()">Jual</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let produkList = [];
  let riwayatList = [];
  let currentFoto = null;
  let currentJualId = null;
  
  // Load data dari localStorage
  function loadData() {
    const p = localStorage.getItem('produkList');
    const r = localStorage.getItem('riwayatList');
    if (p) produkList = JSON.parse(p);
    if (r) riwayatList = JSON.parse(r);
  }
  
  function saveData() {
    localStorage.setItem('produkList', JSON.stringify(produkList));
    localStorage.setItem('riwayatList', JSON.stringify(riwayatList));
  }
  
  // Format Rupiah
  function rupiah(n) {
    return 'Rp ' + Number(n).toLocaleString('id-ID');
  }
  
  // Toast
  function showToast(msg, color = '#10b981') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = color;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  
  // Preview foto
  document.getElementById('inputFoto').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      currentFoto = ev.target.result;
      document.getElementById('previewFoto').innerHTML = `<img src="${currentFoto}">`;
    };
    reader.readAsDataURL(file);
  });
  
  // Tambah produk
  function tambahProduk() {
    const nama = document.getElementById('inputNama').value.trim();
    const modal = parseFloat(document.getElementById('inputModal').value) || 0;
    const jual = parseFloat(document.getElementById('inputJual').value) || 0;
    const stok = parseInt(document.getElementById('inputStok').value) || 0;
    
    if (!nama) return showToast('Nama produk wajib diisi!', '#ef4444');
    if (modal <= 0) return showToast('Harga modal harus lebih dari 0!', '#ef4444');
    if (jual <= 0) return showToast('Harga jual harus lebih dari 0!', '#ef4444');
    if (stok < 0) return showToast('Stok tidak valid!', '#ef4444');
    
    const produk = {
      id: Date.now(),
      nama,
      modal,
      jual,
      stok,
      terjual: 0,
      foto: currentFoto
    };
    
    produkList.push(produk);
    saveData();
    resetForm();
    renderSemua();
    showToast('✅ Produk berhasil ditambahkan!');
  }
  
  function resetForm() {
    document.getElementById('inputNama').value = '';
    document.getElementById('inputModal').value = '';
    document.getElementById('inputJual').value = '';
    document.getElementById('inputStok').value = '';
    document.getElementById('inputFoto').value = '';
    document.getElementById('previewFoto').innerHTML = '📷 Upload Foto';
    currentFoto = null;
  }
  
  // Hapus produk
  function hapusProduk(id) {
    if (!confirm('Yakin hapus produk ini?')) return;
    produkList = produkList.filter(p => p.id !== id);
    saveData();
    renderSemua();
    showToast('🗑️ Produk dihapus', '#ef4444');
  }
  
  // Buka modal jual
  function bukaJual(id) {
    const p = produkList.find(x => x.id === id);
    if (!p) return;
    if (p.stok <= 0) return showToast('Stok habis!', '#ef4444');
    currentJualId = id;
    document.getElementById('jualNamaProduk').textContent = 
      `${p.nama} (Stok: ${p.stok})`;
    document.getElementById('jualQty').value = 1;
    document.getElementById('jualQty').max = p.stok;
    document.getElementById('modalJual').classList.add('show');
  }
  
  function closeJual() {
    document.getElementById('modalJual').classList.remove('show');
    currentJualId = null;
  }
  
  // Konfirmasi jual
  function konfirmasiJual() {
    const p = produkList.find(x => x.id === currentJualId);
    if (!p) return;
    
    const qty = parseInt(document.getElementById('jualQty').value);
    if (!qty || qty <= 0) return showToast('Jumlah tidak valid!', '#ef4444');
    if (qty > p.stok) return showToast('Stok tidak cukup!', '#ef4444');
    
    // Update stok & terjual
    p.stok -= qty;
    p.terjual += qty;
    
    // Simpan riwayat
    riwayatList.unshift({
      id: Date.now(),
      tanggal: new Date().toLocaleString('id-ID'),
      namaProduk: p.nama,
      qty,
      modal: p.modal * qty,
      penjualan: p.jual * qty,
      laba: (p.jual - p.modal) * qty
    });
    
    saveData();
    closeJual();
    renderSemua();
    showToast(`✅ Berhasil jual ${qty} ${p.nama}!`);
  }
  
  // Render semua
  function renderSemua() {
    renderKatalog();
    renderStats();
    renderRiwayat();
  }
  
  // Render katalog
  function renderKatalog() {
    const grid = document.getElementById('productGrid');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = produkList.filter(p => 
      p.nama.toLowerCase().includes(search)
    );
    
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty">Belum ada produk yang cocok.</div>';
      return;
    }
    
    grid.innerHTML = filtered.map(p => `
      <div class="product-card">
        <div class="product-img">
          ${p.foto ? `<img src="${p.foto}">` : '📦'}
        </div>
        <div class="product-info">
          <div class="product-name">${p.nama}</div>
          <div class="product-detail">Modal: <span>${rupiah(p.modal)}</span></div>
          <div class="product-detail">Jual: <span>${rupiah(p.jual)}</span></div>
          <div class="product-detail">
            Stok: <span class="badge ${p.stok > 0 ? 'badge-green' : 'badge-red'}">${p.stok}</span>
            Terjual: <span class="badge badge-blue">${p.terjual}</span>
          </div>
        </div>
        <div class="product-actions">
          <button class="btn btn-sell" onclick="bukaJual(${p.id})" ${p.stok <= 0 ? 'disabled style="opacity:0.5"' : ''}>🛒 Jual</button>
          <button class="btn btn-delete" onclick="hapusProduk(${p.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }
  
  // Render statistik
  function renderStats() {
    let totalModal = 0, totalJual = 0, totalLaba = 0;
    
    riwayatList.forEach(r => {
      totalModal += r.modal;
      totalJual += r.penjualan;
      totalLaba += r.laba;
    });
    
    document.getElementById('statModal').textContent = rupiah(totalModal);
    document.getElementById('statPenjualan').textContent = rupiah(totalJual);
    document.getElementById('statLaba').textContent = rupiah(totalLaba);
    document.getElementById('statProduk').textContent = produkList.length;
  }
  
  // Render riwayat
  function renderRiwayat() {
    const tbody = document.getElementById('riwayatBody');
    if (riwayatList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">Belum ada riwayat penjualan</td></tr>';
      return;
    }
    tbody.innerHTML = riwayatList.map(r => `
      <tr>
        <td style="font-size:11px;color:#666">${r.tanggal}</td>
        <td><strong>${r.namaProduk}</strong></td>
        <td>${r.qty}</td>
        <td>${rupiah(r.modal)}</td>
        <td>${rupiah(r.penjualan)}</td>
        <td style="color:${r.laba >= 0 ? '#10b981' : '#ef4444'};font-weight:bold">
          ${rupiah(r.laba)}
        </td>
      </tr>
    `).join('');
  }
  
  // Switch tab
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }
  
  // Close modal on overlay click
  document.getElementById('modalJual').addEventListener('click', function(e) {
    if (e.target === this) closeJual();
  });
  
  // Init
  loadData();
  renderSemua();
</script>

</body>
</html>
